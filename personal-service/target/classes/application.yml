server:
  port: ${SERVER_PORT:8093}
spring:
  application:
    name: personal-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/FitLife_Personais?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: ${SQL_INIT_MODE:always}
