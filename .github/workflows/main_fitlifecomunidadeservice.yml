# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Comunidade Service - FitLife

on:
  push:
    branches:
      - main
    paths:
      - 'comunidade-service/**'
      - '.github/workflows/**'
      - 'pom.xml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '21'
          cache: maven
          cache-dependency-path: comunidade-service/pom.xml

      - name: Build Comunidade Service
        run: mvn -B -f comunidade-service/pom.xml clean package

      - name: Prepare executable JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy

          mapfile -t jars < <(
            find comunidade-service/target -maxdepth 1 -type f -name '*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar' \
              ! -name '*-tests.jar' \
              ! -name '*-plain.jar'
          )

          if [ "${#jars[@]}" -ne 1 ]; then
            echo "::error::Esperado exatamente um JAR executável; encontrados: ${#jars[@]}"
            printf '%s\n' "${jars[@]}"
            exit 1
          fi

          cp "${jars[0]}" deploy/app.jar
          echo "JAR preparado: ${jars[0]}"

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_FF316F70F6264DBC95C8615989B26806 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A5C72488F8254D9989A1777CC91492B2 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A2F0C2F744804658AE6CC6A4AE9F0A06 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'FitLifeComunidadeService'
          slot-name: 'Production'
          package: './deploy/app.jar'

          