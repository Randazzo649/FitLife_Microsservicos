# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Personal Service - FitLife

on:
  push:
    branches:
      - main
    paths:
      - 'personal-service/**'
      - 'pom.xml'
      - '.github/workflows/main_fitlifepersonalservice.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '21'
          cache: maven
          cache-dependency-path: personal-service/pom.xml

      - name: Build Personal Service
        run: mvn -B -f personal-service/pom.xml clean package

      - name: Prepare executable JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy

          mapfile -t jars < <(
            find personal-service/target -maxdepth 1 -type f -name '*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar' \
              ! -name '*-tests.jar' \
              ! -name '*-plain.jar'
          )

          if [ "${#jars[@]}" -ne 1 ]; then
            echo "::error::Esperado exatamente um JAR executável; encontrados: ${#jars[@]}"
            printf '%s\n' "${jars[@]}"
            exit 1
          fi

          cp "${jars[0]}" deploy/app.jar
          echo "JAR preparado: ${jars[0]}"

      - name: Login to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B28F1F15E9004A9490CD75E62714C76B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_24E2386D1C334D559FBF4B5A2EB2FF2E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5061AE6A879440C6A896E2DF8AD6A46A }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'FitLifePersonalService'
          slot-name: 'Production'
          package: './deploy/app.jar'
