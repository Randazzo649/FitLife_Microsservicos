# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy JAR app to Azure Web App - FitLifeUsuarioservice

on:
  push:
    branches:
      - main
    paths:
      - 'usuario-service/**'
      - 'pom.xml'
      - '.github/workflows/main_fitlifeusuarioservice.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
          cache: maven

      - name: Build usuario-service with Maven
        run: mvn -f usuario-service/pom.xml clean package

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: usuario-service-jar
          path: usuario-service/target/*.jar
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: usuario-service-jar
          path: artifact

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0ABD9AD5DCDF4459AA1875D147C0F7D5 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_EE6000C9C165415E979BFA77475E378A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_702F30A759EC491AB6CEDAD657882DD2 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: FitLifeUsuarioservice
          slot-name: Production
          package: artifact/*.jar

          