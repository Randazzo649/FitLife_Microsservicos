# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Treino Service - FitLife

on:
  push:
    branches:
      - main
    paths:
      - 'treino-service/**'
      - 'pom.xml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '21'
          cache: maven
          cache-dependency-path: treino-service/pom.xml

      - name: Build Treino Service
        run: mvn -B -ntp -f treino-service/pom.xml clean package

      - name: Prepare executable JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy

          mapfile -t jars < <(
            find treino-service/target -maxdepth 1 -type f -name '*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar' \
              ! -name '*-tests.jar' \
              ! -name '*-plain.jar'
          )

          if [ "${#jars[@]}" -ne 1 ]; then
            echo "::error::Esperado exatamente um JAR executável; encontrados: ${#jars[@]}"
            printf '%s\n' "${jars[@]}"
            exit 1
          fi

          cp "${jars[0]}" deploy/app.jar
          echo "JAR preparado: ${jars[0]}"

      - name: Login to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8B66D11F3FBB4B23AC68DA7E5CBE9BB5 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_ACA7CF1442174189B2250D84F2002883 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_FA32C01F032842DBA557D3E269842190 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'FitLifeTreinoService'
          slot-name: 'Production'
          package: './deploy/app.jar'
