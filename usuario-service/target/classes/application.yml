server:
  port: ${SERVER_PORT:8091}
spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  application:
    name: usuario-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/FitLife_Usuarios?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: ${SQL_INIT_MODE:always}
fitlife:
  jwt:
    issuer: ${JWT_ISSUER_URI:http://localhost:8091}
    duration-seconds: ${JWT_DURATION_SECONDS:28800}
  uploads:
    directory: ${FITLIFE_UPLOAD_DIR:./uploads}
