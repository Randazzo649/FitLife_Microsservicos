server:
  port: ${SERVER_PORT:8091}
  forward-headers-strategy: framework
spring:
  application:
    name: usuario-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/FitLife_Usuarios}
      database: ${MONGODB_DATABASE:FitLife_Usuarios}
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8091}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8091/oauth2/jwks}
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
fitlife:
  jwt:
    issuer: ${JWT_ISSUER_URI:http://localhost:8091}
    duration-seconds: ${JWT_DURATION_SECONDS:28800}
    private-key-base64: ${JWT_PRIVATE_KEY_BASE64:}
    public-key-base64: ${JWT_PUBLIC_KEY_BASE64:}
  uploads:
    directory: ${FITLIFE_UPLOAD_DIR:./uploads}
